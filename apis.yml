  - aid: island-is:xroad
    name: X-Road (Straumurinn) API Catalogue
    description: >-
      Iceland's X-Road data-exchange layer (Straumurinn). Government-to-government REST services that
      publish OpenAPI 3.0 descriptions are auto-imported into the X-Road API Catalogue, providing a
      governed, discoverable surface of national government APIs.
    humanURL: https://docs.devland.is/products/x-road.md
