aid: island-is
name: island.is (Digital Iceland)
description: >-
  island.is (Stafrænt Ísland / Digital Iceland) is Iceland's national digital-services and government API
  platform, operated by the Ministry of Finance and Economic Affairs / Digital Iceland. It provides a
  GraphQL gateway at api.island.is (authentication-gated) that fronts internal REST microservices, with
  business/government-to-government REST services described using OpenAPI 3.0 and registered in the X-Road
  "Straumurinn" API Catalogue. The developer handbook is published at docs.devland.is. Iceland's former
  CKAN open-data portal (opingogn.is) has been decommissioned and now redirects to island.is.
