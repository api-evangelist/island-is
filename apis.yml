apis:
  - aid: island-is:graphql
    name: island.is GraphQL Gateway
    description: >-
      Single GraphQL gateway at api.island.is wrapping internal REST microservices that power island.is
      applications. The gateway is authentication-gated (island.is identity server / IdS scopes) and
      returns 404 to anonymous probes. API design conventions are documented in the Digital Iceland
      handbook.
    humanURL: https://docs.devland.is/
    baseURL: https://api.island.is
